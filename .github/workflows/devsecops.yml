name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # scan semanal: pega CVEs novas em dependências já publicadas

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ------------------------------------------------------------------ 1
  qualidade-e-testes:
    name: "1. Lint + testes unitários"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.xml

  # ------------------------------------------------------------------ 2
  segredos:
    name: "2. Secret scanning (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------ 3
  sast:
    name: "3. SAST (Bandit + CodeQL)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "bandit[sarif]==1.8.6"
      - run: bandit -c pyproject.toml -r app -f sarif -o bandit.sarif --exit-zero
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: bandit.sarif
          category: bandit
      - run: bandit -c pyproject.toml -r app -ll    # falha o build em severidade >= MEDIUM
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4

  # ------------------------------------------------------------------ 4
  sca:
    name: "4. SCA - dependências vulneráveis (pip-audit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit==2.9.0
      - run: pip-audit -r requirements.txt --strict

  # ------------------------------------------------------------------ 5
  iac-docker:
    name: "5. Lint do Dockerfile (Hadolint) + IaC (Trivy config)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - name: Trivy config (Dockerfile, compose, workflows)
        run: |
          docker run --rm -v "$PWD:/work" aquasec/trivy:latest config \
            --severity HIGH,CRITICAL --exit-code 1 /work

  # ------------------------------------------------------------------ 6
  build-e-scan-imagem:
    name: "6. Build + scan da imagem (Trivy) + SBOM"
    needs: [qualidade-e-testes, segredos, sast, sca, iac-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (local, ainda sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy - relatório SARIF da imagem
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" \
            aquasec/trivy:latest image --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 0 --format sarif --output /out/trivy-image.sarif \
            ${{ env.IMAGE }}:${{ github.sha }}
      - name: Trivy - gate (bloqueia HIGH/CRITICAL com correção disponível)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 ${{ env.IMAGE }}:${{ github.sha }}
      - name: Trivy - listar achados como anotações (somente se o gate falhar)
        if: failure()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity HIGH,CRITICAL --ignore-unfixed \
            --format json --quiet ${{ env.IMAGE }}:${{ github.sha }} > trivy.json
          python3 - <<'PY'
          import json
          d = json.load(open("trivy.json"))
          n = 0
          for r in d.get("Results", []):
              for v in r.get("Vulnerabilities") or []:
                  n += 1
                  if n <= 40:
                      print(f"::warning title=Trivy {v['Severity']}::{v['VulnerabilityID']} "
                            f"{v['PkgName']} {v['InstalledVersion']} -> {v.get('FixedVersion')} ({r['Target']})")
          print(f"::notice::Total de achados HIGH/CRITICAL corrigíveis: {n}")
          PY
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image.sarif
      - name: SBOM (CycloneDX) com Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Login no GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push da imagem (somente após passar em todos os gates)
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag $IMAGE:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
      - name: Assinar imagem com Cosign (keyless)
        if: github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3
      - if: github.ref == 'refs/heads/main'
        run: cosign sign --yes $IMAGE:${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  # ------------------------------------------------------------------ 7
  dast:
    name: "7. DAST (OWASP ZAP baseline) contra o container"
    needs: [build-e-scan-imagem]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Subir aplicação com provedor mock
        run: |
          docker compose up -d --build
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8000/health && break || sleep 2; done
      - name: ZAP baseline scan
        run: |
          mkdir -p zap && chmod 777 zap
          # exit 1 = falha; exit 2 = apenas avisos (aceitável no baseline); 0 = limpo
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://127.0.0.1:8000 -r zap-report.html || [ $? -eq 2 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: zap/zap-report.html
      - if: always()
        run: docker compose down

  # ------------------------------------------------------------------ 8
  deploy:
    name: "8. Deploy (ambiente protegido por aprovação manual)"
    needs: [dast]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production        # configure "Required reviewers" em Settings > Environments
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH + docker compose
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then echo "Secrets de deploy não configurados - etapa ignorada (modo acadêmico)."; exit 0; fi
          install -m 600 /dev/null key && printf '%s\n' "$DEPLOY_KEY" > key
          scp -i key -o StrictHostKeyChecking=accept-new docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:~/triage/"
          ssh -i key "$DEPLOY_USER@$DEPLOY_HOST" "cd ~/triage && IMAGE=$IMAGE:${{ github.sha }} docker compose pull && IMAGE=$IMAGE:${{ github.sha }} docker compose up -d"
